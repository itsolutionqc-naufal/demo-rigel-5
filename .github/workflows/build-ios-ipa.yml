name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Export Method'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
          - enterprise
      bundle_id:
        description: 'Bundle ID'
        required: false
        default: 'com.rigel.webview'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup Apple Certificate
        uses: apple-actions/import-certificate@v2
        with:
          cert-chain-in-p12: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          cert-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Setup Provisioning Profile
        uses: apple-actions/import-provisioning-profile@v2
        with:
          provisioning-profile: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          provisioning-profile-name: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}

      - name: Install PHP deps
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify Livewire Flux assets exist
        run: |
          ls -la vendor/livewire/flux/dist || true
          test -f vendor/livewire/flux/dist/flux.css

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Import CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Build IPA
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            build

      - name: Create IPA
        working-directory: ios/App
        run: |
          mkdir -p ../output
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -archivePath build/App.xcarchive \
            -exportArchive \
            -exportPath ../output \
            -exportMethod ${{ github.inputs.export_method || 'development' }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.inputs.export_method || 'development' }}
          path: output/app.ipa
          retention-days: 5