name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install PHP deps (composer)
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Verify Livewire Flux assets exist
        run: |
          ls -la vendor/livewire/flux/dist || true
          test -f vendor/livewire/flux/dist/flux.css

      - name: Install JS deps
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Verify Capacitor config
        run: |
          echo "Checking Capacitor configuration..."
          cat capacitor.config.ts
          echo "✅ Capacitor config verified"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rigel-coins-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload APK to release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
